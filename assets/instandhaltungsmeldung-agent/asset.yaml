apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: instandhaltungsmeldung-agent
  description: Fuehrt Nutzer im Dialog durch das Anlegen einer SAP PM Instandhaltungsmeldung – technischen Platz ermitteln, Schaden beschreiben, Vollstaendigkeit pruefen, Prioritaet vorschlagen und Meldung ueber API_MAINTNOTIFICATION anlegen.

provides:
  apis:
    - name: instandhaltungsmeldung-agent
      kind: a2a
      ordId: customer.build:apiResource:instandhaltungsmeldung-b1607.instandhaltungsmeldung-agent:v1

container:
  buildPath: .
  port: 5000

requires:
  - name: sap-s4-maintnotification-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:instandhaltungsmeldung-b1607.sap-s4-maintnotification-mcp-server:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
